<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>JGSA Satna + Maihar Live Dashboard v3</title>
<script src="jgsa_live_data.js"></script>
<style>
:root{--bg:#eef7f8;--card:#ffffff;--ink:#102033;--muted:#617188;--line:#dbe7ef;--blue:#2563eb;--teal:#0891b2;--green:#059669;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;--shadow:0 16px 40px rgba(15,23,42,.08)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",Arial,sans-serif;background:linear-gradient(90deg,#def7f3,#f4f8fb 14%,#f4f8fb 86%,#def7f3);color:var(--ink)}
.header{position:sticky;top:0;z-index:20;margin:0 auto;max-width:1420px;background:linear-gradient(115deg,#064e3b,#0f62b5,#2d5be3);color:#fff;padding:26px 28px 22px;border-radius:0 0 30px 30px;box-shadow:0 10px 28px rgba(31,70,180,.25)}
.header h1{font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:900}.sub{font-weight:700;opacity:.93}.headrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.badge{margin-left:auto;background:linear-gradient(90deg,#22c55e,#06b6d4);padding:12px 22px;border-radius:14px;font-weight:900}.date{background:rgba(255,255,255,.16);padding:10px 14px;border-radius:14px;font-weight:800}.wrap{max-width:1420px;margin:18px auto;padding:0 14px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.70);backdrop-filter:blur(6px);padding:12px;border-radius:22px;box-shadow:var(--shadow)}
.tab{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:13px;font-weight:900;cursor:pointer;color:#152139}.tab.active{background:linear-gradient(90deg,#0891b2,#2563eb);color:#fff;border-color:transparent}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.filters select,.filters input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:180px;font-weight:700}.btn{padding:12px 16px;border:1px solid #bfdbfe;border-radius:12px;background:#fff;color:#1d4ed8;font-weight:900;cursor:pointer}.btn.dark{background:#0f172a;color:#fff;border-color:#0f172a}.grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.kpi{border-top:4px solid var(--teal)}.kpi .label{font-weight:900;color:#475569;font-size:13px;letter-spacing:.05em;text-transform:uppercase}.kpi .val{font-size:33px;font-weight:950;color:#0f2b65;margin-top:6px}.kpi small{color:var(--muted);font-weight:700}.section{margin-top:18px}.section h2{margin:0 0 12px;font-size:24px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);max-height:650px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px 14px;border-bottom:1px solid #e8eef5;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#eff6ff;color:#263b5f;font-size:12px;text-transform:uppercase;z-index:1}tr:hover{background:#f8fafc}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-weight:900;font-size:12px}.gA{background:#dcfce7;color:#047857}.gB{background:#dbeafe;color:#1d4ed8}.gC{background:#fef3c7;color:#a16207}.gD{background:#fee2e2;color:#b91c1c}.score{font-weight:950;color:#0f766e}.muted{color:var(--muted);font-weight:700}.empty{border:1px dashed var(--line);border-radius:18px;background:#fff;padding:28px;text-align:center;color:#64748b;font-weight:800}.formula{line-height:1.9}.miniBtn{background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:900;padding:9px 12px;cursor:pointer;white-space:nowrap}.miniBtn.light{background:#e0f2fe;color:#0369a1}.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;min-width:110px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#facc15,#22c55e);border-radius:99px}.progressCell{display:grid;grid-template-columns:minmax(110px,1fr) 48px;gap:8px;align-items:center}.rankMedal{font-weight:950;color:#d97706}.subline{display:block;color:#64748b;font-size:12px;font-weight:700;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.breakTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.smallFilters{display:flex;gap:10px;flex-wrap:wrap}.smallFilters input,.smallFilters select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700}.categoryName b{display:block;font-size:15px}.categoryName span{color:#2563eb;font-size:12px;font-weight:800}.catLine{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:12px 0 4px}.catLine b{font-weight:950}.catLine>span{font-weight:800;white-space:nowrap}.catInlineMeta{display:inline;margin-left:8px;color:#64748b;font-size:12px;font-weight:800}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;background:#2563eb}.dot.c1{background:#1d4ed8}.dot.c2{background:#facc15}.dot.c3{background:#db2777}.dot.c4{background:#84cc16}.dot.c5{background:#16a34a}.dot.c6{background:#059669}.dot.c7{background:#15803d}.dot.c8{background:#ef4444}
.rankcard{color:#fff;border:0}.rankcard:nth-child(1){background:linear-gradient(120deg,#10b981,#059669)}.rankcard:nth-child(2){background:linear-gradient(120deg,#3b82f6,#2563eb)}.rankcard:nth-child(3){background:linear-gradient(120deg,#f59e0b,#d97706)}.rankcard h3{margin:0;font-size:20px}.rankcard .big{font-size:38px;font-weight:950}.dna{height:150px;display:flex;align-items:center;justify-content:center;color:#0f766e;font-weight:900;background:radial-gradient(circle,#e0f2fe,#fff)}
.zilaGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.zilaCard{background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--line);border-top:4px solid var(--purple);border-radius:18px;box-shadow:var(--shadow);padding:18px}.zilaCard h2{margin:0 0 12px;font-size:22px}.zilaBtn{display:inline-block;background:linear-gradient(90deg,#0f766e,#0284c7);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:900;margin:4px 0 12px;cursor:pointer}.metricGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metricBox{background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:13px}.metricBox b{display:block;font-size:20px;color:#0f172a}.metricBox.clickable{cursor:pointer;transition:.15s}.metricBox.clickable:hover{transform:translateY(-1px);border-color:#0ea5e9;background:#f0f9ff}.criticalBox{background:#fee2e2;border-color:#fb7185;color:#991b1b}.chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#21324b}.note{font-size:12px;color:var(--muted);margin-top:10px}
.dashboardCards{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px;margin-top:16px}.dashCard{background:linear-gradient(180deg,#ffffff,#f8fbff);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:18px;box-shadow:var(--shadow);padding:18px;min-height:170px}.dashCard h3{margin:0 0 8px;font-size:20px}.dashScore{font-size:42px;font-weight:950;color:#0f766e;margin:8px 0}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.miniBox{border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:10px;font-weight:800}.miniBox small{display:block;color:var(--muted);font-weight:700}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.twocol,.three,.zilaGrid{grid-template-columns:1fr}.header h1{font-size:25px}.badge{margin-left:0}.dashboardCards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid,.dashboardCards{grid-template-columns:1fr}.metricGrid{grid-template-columns:1fr}}
@media print{.tabs,.filters,.btn,.actions,.miniBtn{display:none}.header{position:static}.tablewrap{max-height:none;overflow:visible}.card,.tablewrap{box-shadow:none}}
</style>
</head><body>
<header class="header"><div class="headrow"><div><h1>जल गंगा जल संवर्धन अभियान 2026 - सतना एवं मैहर डैशबोर्ड</h1><div class="sub">जनपद सारांश • उपयंत्री रैंकिंग • JGSA Score • Critical कार्य • सम्पूर्ण सूची • Source: Live JGSA Dashboard + Work Monitor + Official Block Ranking</div></div><div class="badge">Developed by Hira Mani Dwivedi SRDM ZP SATNA</div><div class="date" id="updated">Updated: —</div></div></header>
<main class="wrap">
<nav class="tabs" id="tabs"></nav>
<div class="filters">
  <select id="districtFilter"><option value="">All District</option><option value="SATNA">Satna</option><option value="MAIHAR">Maihar</option></select>
  <select id="janpadFilter"><option value="">All Janpad</option></select>
  <input id="search" placeholder="Search work / engineer / GP / code">
  <button class="btn" onclick="window.print()">Export Current View PDF</button>
  <button class="btn" onclick="downloadCSV()">Export CSV</button>
</div>
<div id="app"></div>
</main>
<script>
const D = window.JGSA_LIVE_DATA || {};
const tabs=['मुख्य डैशबोर्ड','Work Monitor','Official Block Ranking','Engineer Ranking','Needs Verification','Score Breakdown','श्रेणी Analysis','District War Room','Achievement Wall','Performance DNA','Meeting Mode'];
let active=0;
let selectedBreakdown=null;
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const money=n=>'₹'+(Number(n||0)/100000).toFixed(2)+' लाख';
const moneyCr=n=>'₹'+(Number(n||0)/10000000).toFixed(2)+' Cr';
const pct=n=>(Number(n||0)).toFixed(1)+'%';
const works=()=>D.works||[]; const blocks=()=>D.blockRankingInternal||D.blockRanking||[]; const summ=()=>D.summary||{};
function districtGroups(){return {SATNA:['MAJHGAWAN','NAGOD','RAMPUR BAGHELAN','SATNA','UNCHAHARA'],MAIHAR:['AMARPATAN','RAMNAGAR','MAIHAR']};}
function districtOfBlock(block){let b=String(block||'').toUpperCase(); for(const [d,arr] of Object.entries(districtGroups())) if(arr.includes(b)) return d; return ''}
function rowDistrict(w){let d=String(w.district||'').toUpperCase(); if(d.includes('MAIHAR')) return 'MAIHAR'; if(d.includes('SATNA')) return 'SATNA'; return districtOfBlock(w.block)}
function gradeClass(g){return 'pill g'+(g||'D')}
function gradeText(g){return (D.gradeLegend&&D.gradeLegend[g]) || ({A:'अच्छा Performance',B:'Progressing',C:'Progress Needed',D:'Critical / Poor Performance'}[g]||'')}
function grade(score){score=Number(score||0); if(score>=8)return 'A'; if(score>=6)return 'B'; if(score>=4)return 'C'; return 'D'}
function init(){
  document.getElementById('updated').textContent='Updated: '+(D.generatedAt?new Date(D.generatedAt).toLocaleString('en-IN'):'Run local fetch');
  document.getElementById('tabs').innerHTML=tabs.map((t,i)=>`<button class="tab ${i===active?'active':''}" onclick="active=${i};selectedBreakdown=null;render()">${t}</button>`).join('');
  document.getElementById('districtFilter').onchange=()=>{updateJanpadOptions(); render();};
  document.getElementById('janpadFilter').onchange=render; document.getElementById('search').oninput=render;
  updateJanpadOptions(); render();
}
function currentDistrict(){return document.getElementById('districtFilter').value}
function currentJanpad(){return document.getElementById('janpadFilter').value}
function currentSearch(){return document.getElementById('search').value.toLowerCase().trim()}
function updateJanpadOptions(){
  let d=currentDistrict(); let all=[...new Set(works().map(w=>String(w.block||'').toUpperCase()).filter(Boolean))].sort();
  let allowed=d?(districtGroups()[d]||[]):all; let sel=currentJanpad();
  document.getElementById('janpadFilter').innerHTML='<option value="">All Janpad</option>'+allowed.map(j=>`<option value="${j}">${j}</option>`).join('');
  if(sel && allowed.includes(sel)) document.getElementById('janpadFilter').value=sel;
}
function matchSearch(obj,q){return !q || JSON.stringify(obj).toLowerCase().includes(q)}
function passDistrictBlock(w){let d=currentDistrict(), j=currentJanpad(); return (!d || rowDistrict(w)===d) && (!j || String(w.block||'').toUpperCase()===j)}
function fworks(){let q=currentSearch(); return works().filter(w=>passDistrictBlock(w)&&matchSearch(w,q))}

function workYear(w){
  let y = w.finYear || w.financialYear || w.year || '';
  if(!y){
    let txt = String(w.rawText||'')+' '+String(w.workName||'');
    let m = txt.match(/20\d{2}\s*[-–]\s*20\d{2}/);
    if(m) y=m[0].replace(/\s+/g,'');
  }
  return y || 'वर्ष लाइव fetch से आएगा';
}
function remainingExp(w){return Math.max(0, Number(w.sanctionAmount||0)-Number(w.bookedAmount||0));}
function openOngoingBreakdown(name){
  let rows=fworks().filter(w=>(w.engineer||'')===name && statusFlags(w).ongoing);
  let groups={};
  rows.forEach(w=>{
    let y=workYear(w);
    groups[y]||(groups[y]={year:y,works:0,sanction:0,booked:0,remaining:0,needs:0});
    let g=groups[y]; g.works++; g.sanction+=Number(w.sanctionAmount||0); g.booked+=Number(w.bookedAmount||0); g.remaining+=remainingExp(w); g.needs+=w.needsVerification?1:0;
  });
  let summary=Object.values(groups).sort((a,b)=>String(a.year).localeCompare(String(b.year)));
  app(`<button class="btn" onclick="dna()">← Performance DNA</button><h2>Ongoing Work Breakdown — ${name}</h2><div class="section twocol"><div class="card"><h2>Total Ongoing</h2><div class="metricGrid"><div class="metricBox"><b>${fmt(rows.length)}</b>चालू कार्य</div><div class="metricBox"><b>${money(rows.reduce((a,w)=>a+remainingExp(w),0))}</b>Remaining Expenditure</div></div></div><div class="card"><h2>Year-wise Summary</h2>${table(['Year','Ongoing Works','Sanction','Booked','Remaining Exp','Verification'], summary.map(g=>[g.year,fmt(g.works),moneyCr(g.sanction),moneyCr(g.booked),money(g.remaining),fmt(g.needs)]))}</div></div><h2>Ongoing Work List</h2>`+table(['#','Year','Work Code','Work Name','Janpad','GP','Type','Status','Sanction','Booked','Remaining Exp','Verification'], rows.map((w,i)=>[i+1,workYear(w),w.workCode,w.workName,w.block,w.panchayat,w.workType,w.status,moneyCr(w.sanctionAmount),moneyCr(w.bookedAmount),money(remainingExp(w)),w.needsVerification?'<span class="pill gD">Needs Verification</span>':''])));
}

function fblocks(){let q=currentSearch(), arr=calcBlocks(fworks()); return arr.filter(b=>matchSearch(b,q))}
function fengs(){let q=currentSearch(), arr=calcEngineers(fworks()); return arr.filter(e=>matchSearch(e,q))}
function fOfficialRows(){let q=currentSearch(); return (D.officialBlockRankingRows||[]).filter(r=>{let b=String(r.Block||r.block||'').toUpperCase(); let fake={block:b}; return passDistrictBlock(fake)&&matchSearch(r,q)})}
function app(html){document.getElementById('app').innerHTML=html}
function statusFlags(w){let s=String(w.status||'').toUpperCase(); let phys=s.includes('PHYSICALLY')||s.includes('PHYSICAL')||s.includes('PHYCS')||s.includes('भौतिक'); let comp=!phys&&(s.includes('COMPLETED')||s.includes('COMPLETE')||s.includes('पूर्ण')); let ongoing=s.includes('ONGOING')||s.includes('प्रगतिरत')||s.includes('IN PROGRESS')||s.includes('चालू')||(!comp&&!phys); return {comp,phys,ongoing}}
function calcCategory(items){let started=items.length; if(!started) return {score:0,partA:0,partB:0,avgExpPct:0,works:0,completedPhy:0,completed:0,physical:0,ongoing:0,sanction:0,booked:0}; let completed=0, physical=0, ongoing=0, completedPhy=0, sanction=0, booked=0, pctSum=0; items.forEach(w=>{let f=statusFlags(w); completed+=f.comp?1:0; physical+=f.phys?1:0; ongoing+=f.ongoing?1:0; completedPhy+=(f.comp||f.phys)?1:0; sanction+=Number(w.sanctionAmount||0); booked+=Number(w.bookedAmount||0); pctSum+=Number(w.expPercent||0)}); let partA=Math.min(5,(completedPhy/started)*5); let partB=sanction?Math.min(5,(booked/sanction)*5):Math.min(5,(pctSum/started)/100*5); return {score:+(partA+partB).toFixed(2),partA:+partA.toFixed(2),partB:+partB.toFixed(2),avgExpPct:+(pctSum/started).toFixed(2),works:started,completedPhy,completed,physical,ongoing,sanction:+sanction.toFixed(2),booked:+booked.toFixed(2)} }
function buildCategoryBreakdown(items){let totalSanction=items.reduce((a,w)=>a+Number(w.sanctionAmount||0),0); let by={}; items.forEach(w=>{let k=w.workType||'Uncategorised'; (by[k]||(by[k]=[])).push(w)}); let out=[]; Object.entries(by).forEach(([category,rows])=>{let c=calcCategory(rows); let weight=totalSanction?(c.sanction/totalSanction)*100:(items.length?c.works/items.length*100:0); out.push({...c,category,weight:+weight.toFixed(2),weighted:+((weight/100)*c.score).toFixed(4),grade:grade(c.score)})}); return out.sort((a,b)=>b.weight-a.weight)}
function calcEngineers(items){let groups={}; items.forEach(w=>{let e=w.engineer||'Unmapped'; (groups[e]||(groups[e]=[])).push(w)}); let out=[]; Object.entries(groups).forEach(([engineer,rows])=>{let cats=buildCategoryBreakdown(rows); let score=+(cats.reduce((a,c)=>a+c.weight/100*c.score,0)).toFixed(2); let g=grade(score); let sanction=rows.reduce((a,w)=>a+Number(w.sanctionAmount||0),0); let booked=rows.reduce((a,w)=>a+Number(w.bookedAmount||0),0); let flags=rows.map(statusFlags); let completed=flags.filter(x=>x.comp).length; let physical=flags.filter(x=>x.phys).length; let ongoing=flags.filter(x=>x.ongoing).length; let gp=new Set(rows.map(w=>w.panchayat).filter(Boolean)).size; let blocks=[...new Set(rows.map(w=>String(w.block||'').toUpperCase()).filter(Boolean))].join(', '); out.push({engineer,janpad:blocks,works:rows.length,completed,physicalCompleted:physical,ongoing,needsVerification:rows.filter(w=>w.needsVerification).length,score,grade:g,gradeText:gradeText(g),avgBookedPct:sanction?booked/sanction*100:0,sanction,booked,categories:cats,gpCount:gp})}); out.sort((a,b)=>b.score-a.score || a.needsVerification-b.needsVerification || b.works-a.works); out.forEach((x,i)=>x.rank=i+1); let byJan={}; out.forEach(x=>{let primary=String(x.janpad||'').split(',')[0].trim()||'UNKNOWN'; (byJan[primary]||(byJan[primary]=[])).push(x); x.primaryJanpad=primary}); Object.values(byJan).forEach(arr=>arr.sort((a,b)=>b.score-a.score || a.needsVerification-b.needsVerification || b.works-a.works).forEach((x,i)=>x.janpadRank=i+1)); return out}
function calcBlocks(items){let groups={}; items.forEach(w=>{let b=String(w.block||'Unknown').toUpperCase(); (groups[b]||(groups[b]=[])).push(w)}); let out=[]; Object.entries(groups).forEach(([block,rows])=>{let cats=buildCategoryBreakdown(rows); let score=+(cats.reduce((a,c)=>a+c.weight/100*c.score,0)).toFixed(2); let g=grade(score); let sanction=rows.reduce((a,w)=>a+Number(w.sanctionAmount||0),0); let booked=rows.reduce((a,w)=>a+Number(w.bookedAmount||0),0); let flags=rows.map(statusFlags); out.push({block,works:rows.length,completed:flags.filter(x=>x.comp).length,physicalCompleted:flags.filter(x=>x.phys).length,ongoing:flags.filter(x=>x.ongoing).length,needsVerification:rows.filter(w=>w.needsVerification).length,score,grade:g,gradeText:gradeText(g),avgBookedPct:sanction?booked/sanction*100:0,sanction,booked,categories:cats,gpCount:new Set(rows.map(w=>w.panchayat).filter(Boolean)).size})}); out.sort((a,b)=>b.score-a.score); out.forEach((x,i)=>x.rank=i+1); return out}
function render(){document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===active)); if(!works().length && active!==2) return app(noData()); [overview,workMonitor,official,engineer,needs,scoreBreakdown,category,war,achieve,dna,meeting][active]();}
function noData(){return '<div class="empty">No data available. Run GitHub Action / local fetch once.</div>'}
function officialSummary(){let s=summ(); return {totalWorks:Number(s.totalWorks||works().length),completed:Number(s.completed||0),completedOnly:Number(s.completedOnly||0),physicalCompleted:Number(s.physicalCompleted||0),abhiyanProgress:Number(s.abhiyanProgress||0),needsVerification:Number(s.needsVerification||works().filter(w=>w.needsVerification).length),sanction:Number(s.sanction||works().reduce((a,w)=>a+Number(w.sanctionAmount||0),0)),booked:Number(s.booked||works().reduce((a,w)=>a+Number(w.bookedAmount||0),0)),bookedPct:Number(s.bookedPct||0),unmappedWorks:Number(s.unmappedWorks||0),engineers:Number(s.engineers||0)}}
function kpis(){let s=officialSummary();return `<div class="grid"><div class="card kpi"><div class="label">Total Target Works</div><div class="val">${fmt(s.totalWorks)}</div><small>JGSA overview source</small></div><div class="card kpi"><div class="label">Total Completed</div><div class="val" style="color:#059669">${fmt(s.completed)}</div><small>Completed + Physically Completed</small></div><div class="card kpi"><div class="label">Abhiyan Progress</div><div class="val">${fmt(s.abhiyanProgress||2911)}</div><small>JGSA overview value</small></div><div class="card kpi"><div class="label">Total Sanction</div><div class="val" style="color:#7c3aed">${moneyCr(s.sanction)}</div><small>Official overview</small></div><div class="card kpi"><div class="label">Total Booked</div><div class="val" style="color:#0f766e">${moneyCr(s.booked)}</div><small>${pct(s.bookedPct)} booked</small></div></div>`}
function distStats(name){let rows=works().filter(w=>rowDistrict(w)===name); let flags=rows.map(statusFlags); let sanction=rows.reduce((a,w)=>a+Number(w.sanctionAmount||0),0); let booked=rows.reduce((a,w)=>a+Number(w.bookedAmount||0),0); return {name,rows,works:rows.length,completed:flags.filter(f=>f.comp).length,physical:flags.filter(f=>f.phys).length,needs:rows.filter(w=>w.needsVerification).length,sanction,booked,gps:new Set(rows.map(w=>w.panchayat).filter(Boolean)).size,bookedPct:sanction?booked/sanction*100:0}}
function zilaCard(st){let chips=(districtGroups()[st.name]||[]).map(j=>`<span class="chip">${j}</span>`).join('');return `<div class="zilaCard"><h2>📍 जिला ${st.name==='SATNA'?'Satna':'Maihar'}</h2><button class="zilaBtn" onclick="document.getElementById('districtFilter').value='${st.name}';updateJanpadOptions();active=1;render()">${st.name} data देखें</button><div class="metricGrid"><div class="metricBox"><b>${fmt(st.works)}</b>JGSA कार्य</div><div class="metricBox criticalBox"><b>${fmt(st.needs)}</b>सत्यापन &lt;30% CC/PHYCS</div><div class="metricBox"><b>${fmt(st.completed+st.physical)}</b>पूर्ण + भौतिक पूर्ण</div><div class="metricBox"><b>${fmt(st.gps)}</b>Gram Panchayat</div><div class="metricBox"><b>${moneyCr(st.sanction)}</b>Total Sanction</div><div class="metricBox"><b>${moneyCr(st.booked)}</b>Total Booked</div><div class="metricBox"><b>${pct(st.bookedPct)}</b>Booked % Avg</div><div class="metricBox"><b>${fmt((districtGroups()[st.name]||[]).length)}</b>Janpad</div></div><div class="chipRow">${chips}</div><div class="note">${st.name==='SATNA'?'Satna में Majhgawan, Nagod, Rampur Baghelan, Satna, Unchahara शामिल हैं।':'Maihar में Amarpatan, Ramnagar, Maihar शामिल हैं।'}</div></div>`}
function overview(){let st=distStats('SATNA'), mh=distStats('MAIHAR'); app(kpis()+`<section class="section zilaGrid">${zilaCard(st)}${zilaCard(mh)}</section><section class="section twocol"><div class="card"><h2>Critical Summary</h2><p><b>${fmt(works().filter(w=>w.needsVerification).length)}</b> Needs Verification works direct JGSA Work Monitor badge se.</p><p><b>${fmt(works().filter(w=>(w.engineer||'')==='Unmapped').length)}</b> works engineer mapping me unmapped.</p></div><div class="card formula"><h2>JGSA Formula</h2><b>Category Weight</b> = Category Sanction / Total Sanction<br><b>Part A</b> = (Completed + Physically Completed) / Started × 5<br><b>Part B</b> = Booked / Sanction × 5<br><b>Composite</b> = Σ(Weight × Category Score)</div></section>`)}
function workMonitor(){let rows=fworks(); app(`<h2>Work Monitor (${fmt(rows.length)})</h2>`+table(['#','Work Code','Work Name','District','Janpad','GP','Engineer','Type','Status','Verification','Sanction','Booked','Booked %'], rows.slice(0,3000).map((w,i)=>[i+1,w.workCode,w.workName,rowDistrict(w),w.block,w.panchayat,w.engineer,w.workType,w.status,w.needsVerification?'<span class="pill gD">Needs Verification</span>':'',money(w.sanctionAmount),money(w.bookedAmount),pct(w.expPercent)]))) }
function official(){
  let rows=fOfficialRows();
  let top=(D.officialBlockTopCards||[]).filter(r=>{let fake={block:String(r.Block||'').toUpperCase()}; return passDistrictBlock(fake)&&matchSearch(r,currentSearch())});
  if(!top.length) top=rows.slice(0,3).map(r=>({Block:r.Block,Total:r.Total,Rank:r.Rank,Completed:r.Completed||'',Started:r.Started||''}));
  app(`<h2>Official JGSA Block Ranking</h2>
    <div class="notice"><b>Source:</b> rankings.php official table. Is tab me Work Monitor se recalculated/internal block score use nahi ho raha.</div>
    <div class="three section">${top.slice(0,3).map(r=>`<div class="card rankcard"><h3>${r.Block}</h3><div class="big">${r.Total}/10</div><p>Rank #${r.Rank}${r.Completed!==''?` • Completed ${r.Completed}`:''}${r.Started!==''?` • Started ${r.Started}`:''}</p></div>`).join('')}</div>
    <div class="card section"><h2>Category Scorecard — Official JGSA Source</h2>${rows.length?table(Object.keys(rows[0]),rows.map(r=>Object.values(r))):'<div class="empty">Official table not fetched yet. Run local fetch.</div>'}</div>
    <section class="card section formula"><h2>JGSA Score Formula</h2><b>Category Weight</b> = Category Sanction Amount / Total Sanction Amount<br><b>Part A</b> = (Completed + Physically Completed) / Started × 5<br><b>Part B</b> = Booked Amount / Sanction Amount × 5<br><b>Category Score</b> = Part A + Part B; <b>Composite Score</b> = Σ(Weight × Category Score)</section>`)
}
function rankTable(rows){return table(['Rank','Name','Score','Grade','Works','Panchayat','Needs Verification','Booked %','Total Sanction','Total Booked'],rows.map(r=>[r.rank,r.block||r.engineer,`<b class="score">${r.score}/10</b>`,`<span class="${gradeClass(r.grade)}">${r.grade} — ${r.gradeText}</span>`,fmt(r.works),fmt(r.gpCount||0),fmt(r.needsVerification),pct(r.avgBookedPct),money(r.sanction),money(r.booked)]))}
function engineer(){let rows=fengs(); app(`<h2>Engineer Ranking — JGSA Formula Based (${fmt(rows.length)})</h2>`+engineerTable(rows))}
function engineerTable(rows){return table(['#','उपयंत्री','Janpad Rank','Score','GP','कार्य','पूर्ण','भौतिक पूर्ण','चालू','Verification','Completion','Sanction','Booked','Remaining Exp','Financial','Action'],rows.map((e,i)=>{let compPct=e.works?((e.completed+e.physicalCompleted)/e.works*100):0; let fin=e.sanction?e.booked/e.sanction*100:0; let rem=Math.max(0,(Number(e.sanction||0)-Number(e.booked||0))); return [`<span class="rankMedal">${i<3?'🏅 ':''}${i+1}</span>`,`<b>${e.engineer}</b><span class="subline">${e.primaryJanpad||e.janpad} • अंतर्गत GP: ${fmt(e.gpCount||0)}</span>`,`<b>Rank ${fmt(e.janpadRank||'-')}</b><span class="subline">in ${e.primaryJanpad||''}</span>`,`<b>${e.score}</b>`,fmt(e.gpCount||0),fmt(e.works),fmt(e.completed),fmt(e.physicalCompleted),fmt(e.ongoing),fmt(e.needsVerification),`<div class="progressCell"><div class="bar"><span style="width:${Math.min(100,compPct)}%"></span></div><b>${pct(compPct)}</b></div>`,moneyCr(e.sanction),moneyCr(e.booked),moneyCr(rem),`<div class="progressCell"><div class="bar"><span style="width:${Math.min(100,fin)}%"></span></div><b>${pct(fin)}</b></div>`,`<div class="actions"><button class="miniBtn" onclick="openGPList('${escapeAttr(e.engineer)}')">GP सूची</button><button class="miniBtn" onclick="openBreakup('${escapeAttr(e.engineer)}')">Breakup</button></div>`] }))}
function escapeAttr(s){return String(s||'').replaceAll('\\','\\\\').replaceAll("'","\\'").replaceAll('\n',' ')}
function openGPList(name){let rows=fworks().filter(w=>(w.engineer||'')===name); let gps={}; rows.forEach(w=>{let k=w.panchayat||'Unknown'; gps[k]||(gps[k]={gp:k,works:0,completed:0,physical:0,ongoing:0,needs:0,sanction:0,booked:0}); let g=gps[k], f=statusFlags(w); g.works++; g.completed+=f.comp?1:0; g.physical+=f.phys?1:0; g.ongoing+=f.ongoing?1:0; g.needs+=w.needsVerification?1:0; g.sanction+=Number(w.sanctionAmount||0); g.booked+=Number(w.bookedAmount||0)}); app(`<button class="btn" onclick="engineer()">← Engineer Ranking</button><h2>GP सूची — ${name}</h2>`+table(['#','GP','Works','पूर्ण','भौतिक पूर्ण','चालू','Needs Verification','Sanction','Booked','Booked %'],Object.values(gps).sort((a,b)=>b.works-a.works).map((g,i)=>[i+1,g.gp,fmt(g.works),fmt(g.completed),fmt(g.physical),fmt(g.ongoing),fmt(g.needs),money(g.sanction),money(g.booked),pct(g.sanction?g.booked/g.sanction*100:0)])))}
function openBreakup(name){selectedBreakdown={type:'engineer',name}; active=5; document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===active)); scoreBreakdown();}
function needs(){let rows=fworks().filter(w=>w.needsVerification); app(`<h2>Needs Verification (${fmt(rows.length)})</h2>`+table(['#','Work Code','Work Name','Engineer','District','Janpad','GP','Type','Status','Booked %'],rows.map((w,i)=>[i+1,w.workCode,w.workName,w.engineer,rowDistrict(w),w.block,w.panchayat,w.workType,w.status,pct(w.expPercent)])))}
function scoreBreakdown(){let title='संपूर्ण क्षेत्र — Score Breakup', rows=fworks(); if(selectedBreakdown&&selectedBreakdown.type==='engineer'){title=selectedBreakdown.name+' — Score Breakup'; rows=fworks().filter(w=>(w.engineer||'')===selectedBreakdown.name)} let cats=buildCategoryBreakdown(rows); let score=+(cats.reduce((a,c)=>a+c.weight/100*c.score,0)).toFixed(2); app(`<div class="card"><div class="breakTitle"><div><h2>${title}</h2><div class="muted">कुल अंक: <b>${score} /10</b> • Target base: selected area/work set</div></div><div class="smallFilters"><input id="breakSearch" placeholder="नाम खोजें" oninput="filterBreakRows()"><select id="breakGrade" onchange="filterBreakRows()"><option value="">सभी ग्रेड</option><option>A</option><option>B</option><option>C</option><option>D</option></select><button class="btn dark" onclick="window.print()">🖨️ Print</button></div></div></div><div id="breakTable" class="section">${breakTable(cats)}</div>`)}
function breakTable(cats){return table(['#','Category','Sanction Cost (₹ Cr)','Weightage','Completion Marks','Running Booking Marks','Total','Weighted Marks'],cats.map((c,i)=>[i+1,`<div class="categoryName"><b><span class="dot c${(i%8)+1}"></span>${c.category}</b><span>कार्य ${fmt(c.works)} • चालू ${fmt(c.ongoing)} • भौतिक पूर्ण ${fmt(c.physical)} • पूर्ण ${fmt(c.completed)} • सत्यापन ${fmt(fworks().filter(w=>w.workType===c.category&&w.needsVerification).length)}</span></div>`,(c.sanction/10000000).toFixed(2),pct(c.weight),c.partA.toFixed(2),c.partB.toFixed(2),`<b>${c.score.toFixed(2)}</b>`,`<b class="score">${c.weighted.toFixed(4)}</b>`]))}
function filterBreakRows(){let titleRows=fworks(); if(selectedBreakdown&&selectedBreakdown.type==='engineer') titleRows=fworks().filter(w=>(w.engineer||'')===selectedBreakdown.name); let q=(document.getElementById('breakSearch')?.value||'').toLowerCase(), g=document.getElementById('breakGrade')?.value||''; let cats=buildCategoryBreakdown(titleRows).filter(c=>(!q||JSON.stringify(c).toLowerCase().includes(q))&&(!g||c.grade===g)); document.getElementById('breakTable').innerHTML=breakTable(cats)}
function category(){let cats=buildCategoryBreakdown(fworks()); app(`<h2>श्रेणी Analysis</h2>`+table(['Category','Works','Complete + Physical','Needs Verification','Sanction','Booked','Booked %','Score'],cats.map(c=>[c.category,fmt(c.works),fmt(c.completedPhy),fmt(fworks().filter(w=>w.workType===c.category&&w.needsVerification).length),money(c.sanction),money(c.booked),pct(c.sanction?c.booked/c.sanction*100:0),`<b>${c.score}/10</b>`]))) }
function war(){let risk=fengs().slice().sort((a,b)=>b.needsVerification-a.needsVerification || a.score-b.score).slice(0,10); let top=fengs().slice(0,10); app(`<h2>District War Room</h2><div class="twocol"><div><h2>Top 10 Risks</h2>${engineerTable(risk)}</div><div><h2>Top 10 Performers</h2>${engineerTable(top)}</div></div>`)}
function achieve(){let topExp=fengs().slice().sort((a,b)=>b.booked-a.booked).slice(0,5), topScore=fengs().slice(0,5), lowVer=fengs().slice().sort((a,b)=>a.needsVerification-b.needsVerification || b.score-a.score).slice(0,5); app(`<h2>Achievement Wall</h2><div class="three"><div>${rankTable(topScore)}</div><div>${table(['#','Engineer','Booked'],topExp.map((e,i)=>[i+1,e.engineer,money(e.booked)]))}</div><div>${table(['#','Engineer','Verification'],lowVer.map((e,i)=>[i+1,e.engineer,e.needsVerification]))}</div></div>`)}
function dna(){let top=fengs().slice(0,12); app(`<h2>Performance DNA</h2><div class="three">${top.map(e=>{let rem=Math.max(0,Number(e.sanction||0)-Number(e.booked||0)); return `<div class="card"><h2>${e.engineer}</h2><p class="muted">${e.primaryJanpad||e.janpad} • District Rank ${e.rank} • Janpad Rank ${e.janpadRank||'-'} • ${e.score}/10</p><div class="metricGrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div class="metricBox clickable" onclick="openOngoingBreakdown('${escapeAttr(e.engineer)}')"><b>${fmt(e.ongoing)}</b>Ongoing Work</div><div class="metricBox"><b>${moneyCr(rem)}</b>Remaining Exp</div><div class="metricBox"><b>${fmt(e.needsVerification)}</b>Verification</div></div>${(e.categories||[]).slice(0,6).map(c=>{let catRows=fworks().filter(w=>(w.engineer||'')===e.engineer && w.workType===c.category); let needs=catRows.filter(w=>w.needsVerification).length; return `<div class="catLine"><div><b>${c.category}</b><span class="catInlineMeta">कार्य ${fmt(c.works)} • चालू ${fmt(c.ongoing)} • भौतिक पूर्ण ${fmt(c.physical)} • पूर्ण ${fmt(c.completed)} • सत्यापन ${fmt(needs)}</span></div><span>${c.score}/10</span></div><div class="bar"><span style="width:${Math.min(100,c.score*10)}%"></span></div>`}).join('')}</div>`}).join('')}</div>`)}
function meeting(){let top=fengs().slice(0,10), bottom=fengs().slice().sort((a,b)=>a.score-b.score || b.needsVerification-a.needsVerification).slice(0,10); app(`<h2>Meeting Mode</h2>${kpis()}<div class="twocol section"><div><h2>Top 10 Upyantri</h2>${engineerTable(top)}</div><div><h2>Bottom 10 / Attention Needed</h2>${engineerTable(bottom)}</div></div><div class="card section"><h2>Meeting Focus</h2><p>Needs Verification: <b>${fmt(fworks().filter(w=>w.needsVerification).length)}</b></p><p>Unmapped Engineer Works: <b>${fmt(fworks().filter(w=>(w.engineer||'')==='Unmapped').length)}</b></p><p>Focus: Bottom 10 engineers + highest verification Janpads first.</p></div>`)}
function table(headers, rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function downloadCSV(){let rows=fworks(); if(!rows.length)return; let keys=['district','workCode','workName','block','panchayat','engineer','workType','status','needsVerification','sanctionAmount','bookedAmount','expPercent']; let csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>{let val=k==='district'?rowDistrict(r):(r[k]??''); return '"'+String(val).replaceAll('"','""')+'"'}).join(','))).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='jgsa_current_view.csv'; a.click();}
init();
</script>
</body></html>
