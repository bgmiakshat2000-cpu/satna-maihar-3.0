<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>JGSA Satna-Maihar Live Dashboard</title>
<script src="jgsa_live_data.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--blue:#2563eb;--green:#16a34a;--orange:#f59e0b;--red:#dc2626;--line:#e5e7eb;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Noto Sans Devanagari,Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#0f3b75,#2563eb);color:white;padding:18px 22px;position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
.header-row{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}.title{font-weight:900;font-size:24px}.sub{opacity:.9;font-size:13px;margin-top:4px}.badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px}.dev{background:#0ea5e9;color:white;border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:0 8px 20px rgba(14,165,233,.25)}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 78px)}
nav{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto}.navbtn{width:100%;border:0;background:#fff;text-align:left;padding:12px 13px;border-radius:12px;margin-bottom:7px;font-weight:800;color:#334155;cursor:pointer}.navbtn:hover,.navbtn.active{background:#eaf2ff;color:#1749bd}.main{padding:20px;overflow:hidden}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white;min-width:170px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#2563eb;border:1px solid #bfdbfe}.section-title{font-size:22px;font-weight:900;margin:8px 0 14px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(150px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.kpi .label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}.kpi .value{font-size:28px;font-weight:950;margin-top:8px}.kpi.blue{border-top:4px solid var(--blue)}.kpi.green{border-top:4px solid var(--green)}.kpi.orange{border-top:4px solid var(--orange)}.kpi.red{border-top:4px solid var(--red)}
table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f1f5f9;color:#334155;font-size:12px;text-transform:uppercase}.scroll{overflow:auto;max-height:70vh;border-radius:14px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900}.A{background:#dcfce7;color:#166534}.B{background:#dbeafe;color:#1d4ed8}.C{background:#fef3c7;color:#92400e}.D{background:#fee2e2;color:#991b1b}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);border-radius:99px}.eng-grid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}.eng-card{border-radius:20px;overflow:hidden;padding:0}.eng-head{background:linear-gradient(135deg,#eef6ff,#fff);padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.eng-name{font-size:18px;font-weight:950}.eng-meta{color:var(--muted);font-size:12px;margin-top:4px}.scorebox{text-align:right}.score{font-size:27px;font-weight:950;color:#1d4ed8}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px}.metric{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:9px}.metric .mval{font-weight:950;font-size:17px}.metric .mlabel{font-size:11px;color:var(--muted);font-weight:800}.grade-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 12px}.grade-chip{border-radius:12px;padding:9px;text-align:center;border:1px solid var(--line);font-size:11px;font-weight:800}.cat{padding:10px 13px;border-top:1px solid #f1f5f9}.cat-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.cat-title{font-weight:900;font-size:13px}.cat-sub{font-size:11px;color:var(--muted)}.attention{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}.att{border-radius:12px;padding:9px;text-align:center;font-weight:900}.att.red{background:#fee2e2;color:#991b1b}.att.orange{background:#ffedd5;color:#9a3412}.att.yellow{background:#fef9c3;color:#854d0e}.war-grid{grid-template-columns:2fr 1fr}.leader-grid{grid-template-columns:repeat(2,minmax(280px,1fr))}.heat{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.heat .card{border-left:6px solid #22c55e}.meeting{background:#0f172a;color:white;min-height:85vh;padding:24px;border-radius:22px}.meeting .card{background:#111c33;border-color:#26344f;color:white}.meeting th{background:#1e293b;color:white}.meeting td{border-color:#26344f}.hide{display:none!important}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;border:1px dashed var(--line)}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:grid;grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.war-grid,.leader-grid{grid-template-columns:1fr}.main{padding:12px}.title{font-size:18px}}
@media print{nav,header,.toolbar,.btn{display:none!important}.layout{display:block}.main{padding:0}.card,table{box-shadow:none}.tab{display:block!important}}
</style>
</head>
<body>
<header><div class="header-row"><div><div class="title">जल गंगा संवर्धन अभियान — JGSA Satna + Maihar Live Dashboard</div><div class="sub">Live source: JGSA dashboard + block-wise Work Monitor + official block rankings</div></div><div class="dev">Developed by Hira Mani Dwivedi SRDM ZP SATNA</div><div class="badge" id="updatedBadge">Loading data...</div></div></header>
<div class="layout"><nav id="nav"></nav><main class="main">
<div class="toolbar"><select id="blockFilter"><option value="">All Janpad</option></select><input id="search" placeholder="Search work / engineer / panchayat"/><button class="btn light" onclick="window.print()">Export Current View PDF</button></div>
<section id="overview" class="tab"></section>
<section id="work" class="tab hide"></section>
<section id="block" class="tab hide"></section>
<section id="engineer" class="tab hide"></section>
<section id="critical" class="tab hide"></section>
<section id="category" class="tab hide"></section>
<section id="war" class="tab hide"></section>
<section id="achievement" class="tab hide"></section>
<section id="dna" class="tab hide"></section>
<section id="meeting" class="tab hide"></section>
</main></div>
<script>
const DATA = window.JGSA_LIVE_DATA || {works:[], engineerRanking:[], blockRankingInternal:[], summary:{}};
const tabs=[['overview','मुख्य डैशबोर्ड'],['work','Work Monitor'],['block','Official Block Ranking'],['engineer','Engineer Ranking'],['critical','Needs Verification'],['category','श्रेणी Analysis'],['war','District War Room'],['achievement','Achievement Wall'],['dna','Performance DNA'],['meeting','Meeting Mode']];
const fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const money=n=>'₹ '+fmt(n)+' L';
const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function setTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id)); render(id)}
function filteredWorks(){let b=document.getElementById('blockFilter').value, q=document.getElementById('search').value.toLowerCase();return (DATA.works||[]).filter(w=>(!b||w.block===b)&&(!q||JSON.stringify(w).toLowerCase().includes(q)))}
function filteredEng(){let b=document.getElementById('blockFilter').value, q=document.getElementById('search').value.toLowerCase();return (DATA.engineerRanking||[]).filter(e=>(!b||String(e.janpad||'').includes(b))&&(!q||JSON.stringify(e).toLowerCase().includes(q)))}
function kpi(label,value,cls='blue'){return `<div class="card kpi ${cls}"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function table(rows, cols){if(!rows||!rows.length)return '<div class="empty">No data available yet. Run GitHub Action once to fetch live JGSA data.</div>';return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?c[2](r):esc(r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function grade(g){return `<span class="pill ${g}">${g}</span>`}
function overview(){let s=DATA.summary||{};let blocks=DATA.blockRankingInternal||[];document.getElementById('overview').innerHTML=`<div class="section-title">मुख्य डैशबोर्ड</div><div class="grid kpis">${kpi('Total Works',fmt(s.totalWorks),'blue')}${kpi('Completed',fmt(s.completed),'green')}${kpi('Physically Completed',fmt(s.physicalCompleted),'green')}${kpi('Ongoing',fmt(s.ongoing),'orange')}${kpi('Needs Verification',fmt(s.needsVerification),'red')}${kpi('Booked %',fmt(s.bookedPct)+'%','blue')}</div><br><div class="grid war-grid"><div class="card"><h3>Janpad Health</h3>${table(blocks,[['Rank','rank'],['Janpad','block'],['Grade','grade',r=>grade(r.grade)+' '+r.gradeText],['Score','score',r=>fmt(r.score)+'/10'],['Works','works'],['Needs Verification','needsVerification'],['Booked %','avgBookedPct',r=>fmt(r.avgBookedPct)+'%']])}</div><div class="card"><h3>Data Sources</h3><p><b>Date:</b> ${esc(DATA.date||'')}</p><p><b>Generated:</b> ${esc(DATA.generatedAt||'')}</p><p><b>Engineers:</b> ${fmt(s.engineers)}</p><p><b>Unmapped Works:</b> ${fmt(s.unmappedWorks)}</p><p class="sub">Work Monitor is fetched Janpad-wise to avoid the 2000-row district limit.</p></div></div>`}
function work(){let rows=filteredWorks();document.getElementById('work').innerHTML=`<div class="section-title">Work Monitor — ${fmt(rows.length)} works</div>${table(rows,[['Janpad','block'],['Panchayat','panchayat'],['Engineer','engineer'],['Work Code','workCode'],['Work Name','workName'],['Category','workType'],['Status','status'],['Exp %','expPercent',r=>fmt(r.expPercent)+'%'],['Verification','needsVerification',r=>r.needsVerification?'<span class="pill D">Needs Verification</span>':'']])}`}
function block(){let official=DATA.officialBlockRankingRows||[], internal=DATA.blockRankingInternal||[];document.getElementById('block').innerHTML=`<div class="section-title">Official Block Ranking + Internal JGSA Score</div><div class="grid leader-grid"><div class="card"><h3>Official JGSA Ranking Source</h3>${table(official,Object.keys(official[0]||{}).slice(0,10).map(k=>[k,k]))}</div><div class="card"><h3>Internal Score from Work Monitor</h3>${table(internal,[['Rank','rank'],['Janpad','block'],['Grade','grade',r=>grade(r.grade)+' '+r.gradeText],['Score','score',r=>fmt(r.score)+'/10'],['Works','works'],['Needs Verification','needsVerification'],['Booked %','avgBookedPct',r=>fmt(r.avgBookedPct)+'%']])}</div></div><br><div class="card"><h3>JGSA Score Formula</h3><p><b>Category Weight</b> = Category Sanction Amount / Total Sanction Amount</p><p><b>Part A</b> = (Completed + Physically Completed) / Started × 5</p><p><b>Part B</b> = Booked Amount / Sanction Amount × 5</p><p><b>Category Score</b> = Part A + Part B; <b>Composite Score</b> = Σ(Weight × Category Score)</p></div>`}
function engCard(e){let cats=(e.categories||[]).slice(0,6);return `<div class="card eng-card"><div class="eng-head"><div><div class="eng-name">#${e.rank} ${esc(e.engineer)}</div><div class="eng-meta">${esc(e.janpad)} | ${fmt(e.works)} works</div></div><div class="scorebox"><div>${grade(e.grade)}</div><div class="score">${fmt(e.score)}</div><div class="eng-meta">/10</div></div></div><div class="metric-grid"><div class="metric"><div class="mval">${fmt(e.avgBookedPct)}%</div><div class="mlabel">AVG Booked</div></div><div class="metric"><div class="mval">${money(e.sanction)}</div><div class="mlabel">Sanction</div></div><div class="metric"><div class="mval">${money(e.booked)}</div><div class="mlabel">Booked</div></div><div class="metric"><div class="mval">${fmt(e.completed+e.physicalCompleted)}</div><div class="mlabel">CC + PHYCS</div></div><div class="metric"><div class="mval">${fmt(e.needsVerification)}</div><div class="mlabel">Needs Verification</div></div><div class="metric"><div class="mval">${e.gradeText}</div><div class="mlabel">Grade Meaning</div></div></div><div class="grade-legend"><div class="grade-chip A">A<br>अच्छा Performance</div><div class="grade-chip B">B<br>Progressing</div><div class="grade-chip C">C<br>Progress Needed</div><div class="grade-chip D">D<br>Critical / Poor</div></div>${cats.map(c=>`<div class="cat"><div class="cat-row"><div><div class="cat-title">${esc(c.category)}</div><div class="cat-sub">${fmt(c.works)} कार्य | Avg ${fmt(c.avgExpPct)}% | A:${fmt(c.partA)} B:${fmt(c.partB)} | Weight ${fmt(c.weight)}%</div></div><b>${fmt(c.score)}/10</b></div><div class="bar"><span style="width:${Math.min(100,(c.score||0)*10)}%"></span></div></div>`).join('')}</div>`}
function engineer(){let rows=filteredEng();document.getElementById('engineer').innerHTML=`<div class="section-title">Engineer Ranking — JGSA Formula</div><div class="grid eng-grid">${rows.map(engCard).join('')||'<div class="empty">No engineer data</div>'}</div>`}
function critical(){let rows=filteredWorks().filter(w=>w.needsVerification);document.getElementById('critical').innerHTML=`<div class="section-title">Needs Verification — ${fmt(rows.length)} works</div>${table(rows,[['Janpad','block'],['Panchayat','panchayat'],['Engineer','engineer'],['Work Code','workCode'],['Work Name','workName'],['Category','workType'],['Status','status'],['Exp %','expPercent',r=>fmt(r.expPercent)+'%']])}`}
function category(){let rows=filteredWorks(), map={};rows.forEach(w=>{let k=w.workType||'Uncategorised';map[k]=map[k]||{category:k,works:0,needs:0,booked:0,sanction:0};map[k].works++;map[k].needs+=w.needsVerification?1:0;map[k].booked+=w.bookedAmount||0;map[k].sanction+=w.sanctionAmount||0});let arr=Object.values(map).sort((a,b)=>b.works-a.works);document.getElementById('category').innerHTML=`<div class="section-title">श्रेणी Analysis</div>${table(arr,[['Category','category'],['Works','works'],['Needs Verification','needs'],['Sanction','sanction',r=>money(r.sanction)],['Booked','booked',r=>money(r.booked)],['Booked %','pct',r=>r.sanction?fmt(r.booked/r.sanction*100)+'%':'0%']])}`}
function war(){let s=DATA.summary||{}, eng=filteredEng(), blocks=DATA.blockRankingInternal||[];let top=eng.slice(0,10), bottom=[...eng].sort((a,b)=>a.score-b.score).slice(0,10);document.getElementById('war').innerHTML=`<div class="section-title">District War Room</div><div class="grid kpis">${kpi('Critical / Verification',fmt(s.needsVerification),'red')}${kpi('Total Works',fmt(s.totalWorks),'blue')}${kpi('Engineers',fmt(s.engineers),'green')}${kpi('Booked %',fmt(s.bookedPct)+'%','blue')}${kpi('Best Janpad',esc((blocks[0]||{}).block||'-'),'green')}${kpi('Needs Attention',esc((blocks[blocks.length-1]||{}).block||'-'),'red')}</div><br><div class="grid leader-grid"><div class="card"><h3>Top 10 Engineers</h3>${table(top,[['Rank','rank'],['Engineer','engineer'],['Score','score',r=>fmt(r.score)],['Grade','grade',r=>grade(r.grade)]])}</div><div class="card"><h3>Bottom 10 / Meeting Focus</h3>${table(bottom,[['Rank','rank'],['Engineer','engineer'],['Score','score',r=>fmt(r.score)],['Needs Verification','needsVerification'],['Grade','grade',r=>grade(r.grade)]])}</div></div>`}
function achievement(){let eng=filteredEng();let byExp=[...eng].sort((a,b)=>b.booked-a.booked).slice(0,10), byScore=eng.slice(0,10), byVer=[...eng].sort((a,b)=>a.needsVerification-b.needsVerification||b.score-a.score).slice(0,10);document.getElementById('achievement').innerHTML=`<div class="section-title">Achievement Wall</div><div class="grid leader-grid"><div class="card"><h3>Highest JGSA Score</h3>${table(byScore,[['Rank','rank'],['Engineer','engineer'],['Score','score',r=>fmt(r.score)],['Grade','grade',r=>grade(r.grade)]])}</div><div class="card"><h3>Highest Booked Amount</h3>${table(byExp,[['Engineer','engineer'],['Booked','booked',r=>money(r.booked)],['Score','score',r=>fmt(r.score)]])}</div><div class="card"><h3>Best Verification Position</h3>${table(byVer,[['Engineer','engineer'],['Needs Verification','needsVerification'],['Score','score',r=>fmt(r.score)]])}</div></div>`}
function dna(){let eng=filteredEng().slice(0,30);document.getElementById('dna').innerHTML=`<div class="section-title">Performance DNA</div><div class="grid eng-grid">${eng.map(e=>`<div class="card"><h3>${esc(e.engineer)}</h3><p>${esc(e.janpad)} | Rank #${e.rank}</p>${[['Score',e.score*10],['Booked',e.avgBookedPct],['Completion',((e.completed+e.physicalCompleted)/Math.max(1,e.works))*100],['Verification Health',Math.max(0,100-(e.needsVerification/Math.max(1,e.works))*100)]].map(x=>`<div class="cat-row"><b>${x[0]}</b><span>${fmt(x[1])}%</span></div><div class="bar"><span style="width:${Math.min(100,x[1])}%"></span></div>`).join('<br>')}</div>`).join('')}</div>`}
function meeting(){let eng=filteredEng(), top=eng.slice(0,10), bottom=[...eng].sort((a,b)=>a.score-b.score).slice(0,10);document.getElementById('meeting').innerHTML=`<div class="meeting"><h1>Meeting Mode — JGSA Satna + Maihar</h1><div class="grid kpis">${kpi('Needs Verification',fmt((DATA.summary||{}).needsVerification),'red')}${kpi('Total Works',fmt((DATA.summary||{}).totalWorks),'blue')}${kpi('Booked %',fmt((DATA.summary||{}).bookedPct)+'%','green')}</div><br><div class="grid leader-grid"><div class="card"><h2>Top 10</h2>${table(top,[['Rank','rank'],['Engineer','engineer'],['Score','score',r=>fmt(r.score)],['Grade','grade',r=>grade(r.grade)]])}</div><div class="card"><h2>Bottom 10 + Focus</h2>${table(bottom,[['Rank','rank'],['Engineer','engineer'],['Score','score',r=>fmt(r.score)],['Verification','needsVerification'],['Grade','grade',r=>grade(r.grade)]])}</div></div><br><div class="card"><h2>Meeting Focus</h2><p>1. Bottom 10 engineers review.</p><p>2. Needs Verification works clearance.</p><p>3. Low category score works review.</p></div></div>`}
function render(id){({overview,work,block,engineer,critical,category,war,achievement,dna,meeting}[id]||overview)()}
function init(){document.getElementById('updatedBadge').textContent=DATA.generatedAt?('Updated: '+new Date(DATA.generatedAt).toLocaleString('en-IN')):'Run auto-update';document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button class="navbtn" data-id="${id}" onclick="setTab('${id}')">${n}</button>`).join('');let blocks=[...new Set((DATA.works||[]).map(w=>w.block).filter(Boolean))].sort();document.getElementById('blockFilter').innerHTML='<option value="">All Janpad</option>'+blocks.map(b=>`<option>${esc(b)}</option>`).join('');document.getElementById('blockFilter').onchange=()=>render(document.querySelector('.tab:not(.hide)').id);document.getElementById('search').oninput=()=>render(document.querySelector('.tab:not(.hide)').id);setTab('overview')}
init();
</script>
</body></html>
